<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Helper</title>
  <style>
    /* -------- Reset + Base -------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d14;
      color: #f1f5f9;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* -------- Header Bar -------- */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #13131f;
      border-bottom: 1px solid #1e1e2e;
      flex-shrink: 0;
    }

    .logo { font-size: 13px; font-weight: 700; color: #818cf8; }

    #conn-status { font-size: 11px; color: #334155; display: flex; align-items: center; gap: 5px; }
    #conn-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; }
    #conn-dot.on { background: #4ade80; }

    /* -------- Mode Bar -------- */
    #mode-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px;
      background: #0d0d14;
      border-bottom: 1px solid #1e1e2e;
      flex-shrink: 0;
    }

    #mode-label { font-size: 11px; color: #475569; flex: 1; }

    .toggle-wrap { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #475569; }
    .toggle { position: relative; width: 34px; height: 18px; }
    .toggle input { display: none; }
    .toggle-slider {
      position: absolute; inset: 0; background: #1e293b;
      border-radius: 18px; cursor: pointer; transition: 0.2s;
    }
    .toggle-slider:before {
      content: ''; position: absolute;
      width: 12px; height: 12px; background: #64748b;
      border-radius: 50%; top: 3px; left: 3px; transition: 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: #4f46e5; }
    .toggle input:checked + .toggle-slider:before { background: white; transform: translateX(16px); }

    /* -------- Actions Bar -------- */
    #actions {
      display: flex; gap: 8px; align-items: center;
      padding: 8px 14px;
      border-bottom: 1px solid #1e1e2e;
      flex-shrink: 0;
    }

    /* -------- Mic Button -------- */
    #mic-btn {
      flex: 1; padding: 7px 10px;
      border: none; border-radius: 7px;
      background: #4f46e5; color: white;
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: 0.15s;
      display: none;
    }
    #mic-btn.listening { background: #dc2626; animation: pulse 1.2s infinite; }
    #mic-btn:hover { filter: brightness(1.1); }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }

    /* -------- Screen Capture Button -------- */
    #capture-btn {
      padding: 7px 12px; border: none; border-radius: 7px;
      background: #1e293b; color: #94a3b8;
      font-size: 12px; cursor: pointer; transition: 0.15s;
    }
    #capture-btn:hover { background: #273548; color: white; }
    
    /* -------- Timer Button (shows after 10s) -------- */
    #timer-btn {
      padding: 7px 10px; border: none; border-radius: 7px;
      background: #1e293b; color: #f59e0b;
      font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.15s;
      display: none;
    }
    #timer-btn:hover { background: #273548; color: #fbbf24; }
    
    /* -------- Clear Button -------- */
    #clear-btn {
      padding: 7px 10px; border: none; border-radius: 7px;
      background: transparent; color: #334155;
      font-size: 11px; cursor: pointer; transition: 0.15s;
    }
    #clear-btn:hover { color: #64748b; }

    /* -------- Clear Button -------- */
    #clear-btn {
      padding: 7px 10px; border: none; border-radius: 7px;
      background: transparent; color: #334155;
      font-size: 11px; cursor: pointer; transition: 0.15s;
    }
    #clear-btn:hover { color: #64748b; }

    /* -------- Content Area (scrollable) -------- */
    #content {
      flex: 1; overflow-y: auto;
      padding: 12px 14px;
      display: flex; flex-direction: column; gap: 10px;
      scroll-behavior: smooth;
    }

    /* -------- Custom Scrollbar -------- */
    #content::-webkit-scrollbar { width: 4px; }
    #content::-webkit-scrollbar-track { background: transparent; }
    #content::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

    /* -------- Question Box -------- */
    #question-box {
      background: rgba(99,102,241,0.08);
      border-left: 3px solid #6366f1;
      padding: 8px 12px; border-radius: 6px;
      font-size: 12px; color: #818cf8;
      display: none;
    }

    /* -------- Answer Box -------- */
    #answer-box {
      background: #13131f;
      border-radius: 8px; padding: 14px;
      font-size: 14px; line-height: 1.8;
      color: #94a3b8; white-space: pre-wrap;
      min-height: 60px;
    }
    #answer-box.active { color: #e2e8f0; border-left: 3px solid #4ade80; }

    /* -------- Cursor blink -------- */
    .cursor {
      display: inline-block; width: 2px; height: 14px;
      background: #4ade80; margin-left: 2px;
      vertical-align: middle; animation: blink 0.8s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* -------- Direct Input Box -------- */
    #ask-section {
      border-top: 1px solid #1e1e2e;
      padding: 10px 14px;
      background: #0d0d14;
      flex-shrink: 0;
      display: flex; gap: 8px; align-items: flex-end;
    }

    #ask-input {
      flex: 1; padding: 8px 12px;
      background: #13131f; border: 1px solid #1e293b;
      border-radius: 8px; color: #e2e8f0;
      font-size: 13px; font-family: 'Segoe UI', sans-serif;
      resize: none; outline: none; min-height: 38px; max-height: 100px;
      transition: border 0.15s;
    }
    #ask-input:focus { border-color: #4f46e5; }
    #ask-input::placeholder { color: #334155; }

    #ask-btn {
      padding: 8px 14px; border: none; border-radius: 8px;
      background: #4f46e5; color: white;
      font-size: 13px; cursor: pointer; transition: 0.15s;
      white-space: nowrap;
    }
    #ask-btn:hover { background: #4338ca; }
    #ask-btn:disabled { background: #1e293b; color: #475569; cursor: default; }

    /* -------- Status Bar -------- */
    #status-bar {
      padding: 5px 14px; font-size: 10px; color: #334155;
      border-top: 1px solid #1e1e2e; flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- -------- Header -------- -->
  <div id="header">
    <span class="logo">⚡ Helper</span>
    <div id="conn-status">
      <span id="conn-dot"></span>
      <span id="conn-text">Connecting...</span>
    </div>
  </div>

  <!-- -------- Mode Toggle -------- -->
  <div id="mode-bar">
    <span id="mode-label">🤖 Auto — always listening</span>
    <div class="toggle-wrap">
      <span>Auto</span>
      <label class="toggle">
        <input type="checkbox" id="mode-toggle" onchange="toggleMode()"/>
        <span class="toggle-slider"></span>
      </label>
      <span>Manual</span>
    </div>
  </div>

  <!-- -------- Action Buttons -------- -->
  <div id="actions">
    <!-- -------- Mic Button (Manual Only) -------- -->
    <button id="mic-btn" onclick="toggleMic()">🎙️ Start Listening</button>
    <!-- -------- Screen Capture Button -------- -->
    <button id="capture-btn" onclick="captureScreen()">📸 Capture Screen</button>
    <!-- -------- Timer Button (shows after 10s) -------- -->
    <button id="timer-btn" onclick="resetTimer()">⏱️ 20s</button>
    <!-- -------- Clear Button -------- -->
    <button id="clear-btn" onclick="clearAll()">✕ Clear</button>
  </div>

  <!-- -------- Scrollable Content -------- -->
  <div id="content">
    <!-- -------- Question Display -------- -->
    <div id="question-box"></div>
    <!-- -------- Answer Display -------- -->
    <div id="answer-box">Waiting for question...</div>
  </div>

  <!-- -------- Direct Ask Input Box -------- -->
  <div id="ask-section">
    <textarea
      id="ask-input"
      placeholder="Ask anything directly..."
      rows="1"
      onkeydown="handleAskKey(event)"
    ></textarea>
    <button id="ask-btn" onclick="sendDirectQuestion()">Ask ↑</button>
  </div>

  <!-- -------- Status Bar -------- -->
  <div id="status-bar">Ready</div>

<script>
  // -------- State --------
  let ws, isListening = false, isManual = false, currentAnswer = '';
  let timerStartTime = Date.now();  // Track when timeout timer should start
  let timerInterval = null;  // Keep-alive timer interval

  // -------- Connect WebSocket --------
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);

    ws.onopen = () => {
      document.getElementById('conn-dot').className = 'on';
      document.getElementById('conn-text').textContent = 'Connected';
      startTimeoutMonitor();  // Start monitoring timeout after connection
    };

    ws.onclose = () => {
      document.getElementById('conn-dot').className = '';
      document.getElementById('conn-text').textContent = 'Reconnecting...';
      if (timerInterval) clearInterval(timerInterval);
      setTimeout(connect, 2000);
    };

    // -------- Handle Incoming Messages --------
    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);

      // -------- Question --------
      if (data.type === 'question') {
        document.getElementById('question-box').style.display = 'block';
        document.getElementById('question-box').textContent = '❓ ' + data.text;
        currentAnswer = '';
        const ab = document.getElementById('answer-box');
        ab.className = 'active';
        ab.innerHTML = '<span class="cursor"></span>';
        setStatus('⏳ Generating...');
        timerStartTime = Date.now();  // Reset timer on new question
      }

      // -------- Answer Chunk --------
      if (data.type === 'answer_chunk') {
        currentAnswer += data.text;
        document.getElementById('answer-box').innerHTML =
          currentAnswer + '<span class="cursor"></span>';
        // -------- Auto scroll --------
        const content = document.getElementById('content');
        content.scrollTop = content.scrollHeight;
      }

      // -------- Answer Done --------
      if (data.type === 'answer_done') {
        document.getElementById('answer-box').innerHTML = currentAnswer;
        document.getElementById('answer-box').className = '';
        document.getElementById('ask-btn').disabled = false;
        setStatus('✅ Ready');
      }

      // -------- Status --------
      if (data.type === 'status') { setStatus(data.text); }

      // -------- Mode sync from tkinter --------
      if (data.type === 'mode_change') {
        const toggle = document.getElementById('mode-toggle');
        if (toggle.checked !== data.manual) {
          toggle.checked = data.manual;
          applyModeUI(data.manual);
        }
      }

      // -------- Timer reset from other client or STT --------
      if (data.type === 'timer_reset') {
        timerStartTime = Date.now();
        document.getElementById('timer-btn').style.display = 'none';
      }
    };
  }

  // -------- Timeout monitoring --------
  function startTimeoutMonitor() {
    if (timerInterval) clearInterval(timerInterval);
    
    timerInterval = setInterval(() => {
      const elapsedMs = Date.now() - timerStartTime;
      const elapsedSecs = Math.floor(elapsedMs / 1000);
      const timerBtn = document.getElementById('timer-btn');
      
      // Show timer after 10 seconds (user can click to reset)
      if (elapsedSecs >= 10) {
        timerBtn.style.display = 'block';
        const remaining = Math.max(0, 20 - elapsedSecs);  // 20 sec total timeout
        timerBtn.textContent = `⏱️ ${remaining}s`;
        
        // Hide when timeout reached
        if (remaining === 0) {
          timerBtn.style.display = 'none';
        }
      } else {
        timerBtn.style.display = 'none';
      }
    }, 100);  // Update every 100ms for smooth countdown
  }

  // -------- Reset timer (user clicked timer button) --------
  function resetTimer() {
    timerStartTime = Date.now();
    document.getElementById('timer-btn').style.display = 'none';
    ws.send(JSON.stringify({ cmd: 'reset_timer' }));
  }

  // -------- Mode Toggle --------
  function toggleMode() {
    isManual = document.getElementById('mode-toggle').checked;
    applyModeUI(isManual);
    ws.send(JSON.stringify({ cmd: 'set_mode', manual: isManual }));
  }

  function applyModeUI(manual) {
    isManual = manual;
    const label = document.getElementById('mode-label');
    const micBtn = document.getElementById('mic-btn');
    if (manual) {
      label.textContent = '🖐️ Manual — press button to listen';
      micBtn.style.display = 'block';
    } else {
      label.textContent = '🤖 Auto — always listening';
      micBtn.style.display = 'none';
      if (isListening) stopMic();
    }
  }

  // -------- Mic Button --------
  function toggleMic() {
    isListening ? stopMic() : startMic();
  }

  function startMic() {
    isListening = true;
    const btn = document.getElementById('mic-btn');
    btn.textContent = '⏹️ Stop Listening';
    btn.className = 'listening';
    setStatus('🎙️ Listening...');
    ws.send(JSON.stringify({ cmd: 'manual_start' }));
  }

  function stopMic() {
    isListening = false;
    const btn = document.getElementById('mic-btn');
    btn.textContent = '🎙️ Start Listening';
    btn.className = '';
    setStatus('⏳ Processing...');
    ws.send(JSON.stringify({ cmd: 'manual_stop' }));
  }

  // -------- Screen Capture Button --------
  function captureScreen() {
    setStatus('📸 Capturing screen...');
    ws.send(JSON.stringify({ cmd: 'capture_screen' }));
  }

  // -------- Direct Ask Input Box --------
  function sendDirectQuestion() {
    const input = document.getElementById('ask-input');
    const question = input.value.trim();
    if (!question) return;
    input.value = '';
    document.getElementById('ask-btn').disabled = true;
    setStatus('💬 Asking...');
    ws.send(JSON.stringify({ cmd: 'direct_ask', text: question }));
  }

  // -------- Press Enter to send (Shift+Enter for newline) --------
  function handleAskKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendDirectQuestion();
    }
  }

  // -------- Clear --------
  function clearAll() {
    document.getElementById('question-box').style.display = 'none';
    document.getElementById('question-box').textContent = '';
    document.getElementById('answer-box').textContent = 'Waiting for question...';
    document.getElementById('answer-box').className = '';
    currentAnswer = '';
    setStatus('Ready');
  }

  function setStatus(text) {
    document.getElementById('status-bar').textContent = text;
  }

  connect();
</script>
</body>
</html>
